################
# Referral Network
################
query FetchUserReferralNetworkStats {
  fetchUserReferralNetworkStats {
    totalCount
    level1Count
    level2Count
    level3Count
  }
}

query FetchDriverReferralNetworkStats {
  fetchDriverReferralNetworkStats {
    totalCount
    level1Count
    level2Count
    level3Count
  }
}

query SearchReferralUsers($filter: ReferralNetworkSearchInput) {
  searchReferralUsers(filter: $filter) {
    data {
      _id
      name
      email
      tier
      totalPoints
    }
    totalCount
  }
}

query SearchReferralDrivers($filter: ReferralNetworkSearchInput) {
  searchReferralDrivers(filter: $filter) {
    data {
      _id
      name
      email
      tier
      totalPoints
    }
    totalCount
  }
}

query FetchUserReferralNetworkDetail($userId: String!) {
  fetchUserReferralNetworkDetail(userId: $userId) {
    _id
    name
    email
    tier
    totalPoints
    directPoints
    residualPoints
    level1 {
      pointsPerActivity
      memberCount
      members {
        _id
        name
        email
        phone
        createdAt
        activityCount
        points
        releasedRewards
        pendingRewards
        expiredRewards
      }
    }
    level2 {
      pointsPerActivity
      memberCount
      members {
        _id
        name
        email
        phone
        createdAt
        activityCount
        points
        releasedRewards
        pendingRewards
        expiredRewards
      }
    }
    level3 {
      pointsPerActivity
      memberCount
      members {
        _id
        name
        email
        phone
        createdAt
        activityCount
        points
        releasedRewards
        pendingRewards
        expiredRewards
      }
    }
  }
}

